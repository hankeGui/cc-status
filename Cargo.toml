[package]
name = "cc-status"
version = "0.2.1"
edition = "2021"
description = "Multi-line, mode-switchable status line for Claude Code"
license = "MIT"

[[bin]]
name = "ccs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serial_test = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
